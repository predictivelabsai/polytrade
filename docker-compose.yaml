services:
  hermes:
    image: nousresearch/hermes-agent:${HERMES_IMAGE_TAG:-v2026.7.7.2}
    command: ["gateway", "run"]
    expose:
      - "8642"
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY:-}
      - API_SERVER_MODEL_NAME=${HERMES_API_MODEL:-hermes-agent}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - HERMES_EXEC_ASK=false
      - HERMES_MAX_ITERATIONS=${HERMES_MAX_ITERATIONS:-20}
    volumes:
      - hermes-data:/opt/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8642/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "4000:4000"
    environment:
      - MODEL=${MODEL:-grok-4-fast-reasoning}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-xai}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - FINANCIAL_DATA_PROVIDER=${FINANCIAL_DATA_PROVIDER:-}
      - FINANCIAL_DATASETS_API_KEY=${FINANCIAL_DATASETS_API_KEY:-}
      - MASSIVE_API_KEY=${MASSIVE_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - POLYMARKET_WALLET_PRIVATE_KEY=${POLYMARKET_WALLET_PRIVATE_KEY:-}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-}
      - TOMORROWIO_API_KEY=${TOMORROWIO_API_KEY:-}
      - VISUAL_CROSSING_API_KEY=${VISUAL_CROSSING_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - POLYCODE_DB_URL=${POLYCODE_DB_URL:-}
      - CHAT_REQUIRE_DATABASE=${CHAT_REQUIRE_DATABASE:-true}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ISSUER=${JWT_ISSUER:-polytrade}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-polytrade-api}
      - ASSETHERO_CLIENT_ID=${ASSETHERO_CLIENT_ID:-}
      - ASSETHERO_CLIENT_SECRET=${ASSETHERO_CLIENT_SECRET:-}
      - ASSETHERO_SERVICE_USER_ID=${ASSETHERO_SERVICE_USER_ID:-}
      - SERVICE_TOKEN_TTL_SECONDS=${SERVICE_TOKEN_TTL_SECONDS:-900}
      - SERVICE_AUTH_RATE_LIMIT_PER_MINUTE=${SERVICE_AUTH_RATE_LIMIT_PER_MINUTE:-10}
      - SERVICE_CHAT_RATE_LIMIT_PER_MINUTE=${SERVICE_CHAT_RATE_LIMIT_PER_MINUTE:-120}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4002,http://localhost:4003}
      - CHAT_MAX_MESSAGE_CHARS=${CHAT_MAX_MESSAGE_CHARS:-20000}
      - CHAT_MAX_HISTORY_MESSAGES=${CHAT_MAX_HISTORY_MESSAGES:-50}
      - CHAT_MAX_CONCURRENT_RUNS=${CHAT_MAX_CONCURRENT_RUNS:-8}
      - CHAT_RUN_TIMEOUT_SECONDS=${CHAT_RUN_TIMEOUT_SECONDS:-300}
      - CHAT_STALE_RUN_SECONDS=${CHAT_STALE_RUN_SECONDS:-600}
      - CHAT_RATE_LIMIT_PER_MINUTE=${CHAT_RATE_LIMIT_PER_MINUTE:-30}
      - AUTH_RATE_LIMIT_PER_MINUTE=${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      - CHAT_SSE_HEARTBEAT_SECONDS=${CHAT_SSE_HEARTBEAT_SECONDS:-15}
      - AGENT_FRAMEWORK=deepagents
      - HERMES_API_URL=${HERMES_API_URL:-http://hermes:8642/v1}
      - HERMES_API_SERVER_KEY=${HERMES_API_SERVER_KEY:-}
      - HERMES_API_MODEL=${HERMES_API_MODEL:-hermes-agent}
      - HERMES_API_TIMEOUT_SECONDS=${HERMES_API_TIMEOUT_SECONDS:-180}
      - HERMES_PERSIST_SESSIONS=${HERMES_PERSIST_SESSIONS:-true}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - TELEGRAM_USER_MAP=${TELEGRAM_USER_MAP:-{}}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET:-}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_GRAPH_VERSION=${WHATSAPP_GRAPH_VERSION:-v23.0}
      - WHATSAPP_USER_MAP=${WHATSAPP_USER_MAP:-{}}
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:4000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.fasthtml
    ports:
      - "4002:4002"
    environment:
      - WEB_RELOAD=false
      - MODEL=${MODEL:-grok-4-fast-reasoning}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-xai}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - FINANCIAL_DATA_PROVIDER=${FINANCIAL_DATA_PROVIDER:-}
      - FINANCIAL_DATASETS_API_KEY=${FINANCIAL_DATASETS_API_KEY:-}
      - MASSIVE_API_KEY=${MASSIVE_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - POLYMARKET_WALLET_PRIVATE_KEY=${POLYMARKET_WALLET_PRIVATE_KEY:-}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-}
      - TOMORROWIO_API_KEY=${TOMORROWIO_API_KEY:-}
      - VISUAL_CROSSING_API_KEY=${VISUAL_CROSSING_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - POLYCODE_DB_URL=${POLYCODE_DB_URL:-}
      - CHAT_REQUIRE_DATABASE=${CHAT_REQUIRE_DATABASE:-true}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:4002/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  agui:
    build:
      context: .
      dockerfile: Dockerfile.agui
    ports:
      - "4003:4003"
    environment:
      - MODEL=${MODEL:-grok-4-fast-reasoning}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-xai}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - FINANCIAL_DATA_PROVIDER=${FINANCIAL_DATA_PROVIDER:-}
      - FINANCIAL_DATASETS_API_KEY=${FINANCIAL_DATASETS_API_KEY:-}
      - MASSIVE_API_KEY=${MASSIVE_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - POLYMARKET_WALLET_PRIVATE_KEY=${POLYMARKET_WALLET_PRIVATE_KEY:-}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-}
      - TOMORROWIO_API_KEY=${TOMORROWIO_API_KEY:-}
      - VISUAL_CROSSING_API_KEY=${VISUAL_CROSSING_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - POLYCODE_DB_URL=${POLYCODE_DB_URL:-}
      - CHAT_REQUIRE_DATABASE=${CHAT_REQUIRE_DATABASE:-true}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - CHAT_MAX_MESSAGE_CHARS=${CHAT_MAX_MESSAGE_CHARS:-20000}
      - CHAT_MAX_HISTORY_MESSAGES=${CHAT_MAX_HISTORY_MESSAGES:-50}
      - CHAT_MAX_CONCURRENT_RUNS=${CHAT_MAX_CONCURRENT_RUNS:-8}
      - CHAT_RUN_TIMEOUT_SECONDS=${CHAT_RUN_TIMEOUT_SECONDS:-300}
      - CHAT_STALE_RUN_SECONDS=${CHAT_STALE_RUN_SECONDS:-600}
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:4003/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  hermes-data:
