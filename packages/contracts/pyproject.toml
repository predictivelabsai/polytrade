[project]
name = "polytrade-contracts"
version = "4.0.0"
description = "Shared Pydantic contracts for PolyTrade services and FastHTML views"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11.7,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1,<9",
  "ruff>=0.12.7,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polytrade_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]
