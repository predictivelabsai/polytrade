<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wallet chain-switch test — PolyTrade</title>
    <style>
      body { font-family: ui-monospace, monospace; background: #0a0d14; color: #e2e8f0; padding: 2rem; }
      button { background: #10b981; color: #04140d; border: 0; border-radius: 8px; padding: .7rem 1.2rem; font-size: 1rem; margin-right: .5rem; cursor: pointer; }
      button.ghost { background: #1e293b; color: #e2e8f0; }
      pre { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 1rem; margin-top: 1rem; white-space: pre-wrap; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>Wallet chain-switch test</h1>
    <p>Use a wallet left on a <strong>non-Polygon</strong> network (e.g. Optimism) to exercise the auto-switch.</p>
    <p>
      <button id="connect">1 · Connect wallet (must auto-switch to Polygon)</button>
      <button id="sign" class="ghost">2 · Sign test payload on chain 137</button>
    </p>
    <pre id="out">// waiting…</pre>
    <script type="module">
      import { connectWallet, signTypedPayload } from "/src/wallet.ts";

      const out = document.getElementById("out");
      let wallet = null;
      const log = (message, obj) => {
        out.textContent += "\n\n== " + message;
        if (obj !== undefined) out.textContent += ":\n" + JSON.stringify(obj, (k, v) => typeof v === "bigint" ? v.toString() : v, 2);
      };

      document.getElementById("connect").addEventListener("click", async () => {
        try {
          out.textContent = "// connecting…";
          const started = Date.now();
          wallet = await connectWallet();
          log("connected (chain-switch took " + (Date.now() - started) + "ms)", {
            address: wallet.address,
          });
          const chainId = await wallet.provider.request({ method: "eth_chainId" });
          log("active chain after connect", { chainId });
          log(chainId === "0x89" ? "PASS: wallet is on Polygon" : "FAIL: wallet is NOT on Polygon — chain-switch did not hold");
        } catch (caught) {
          log("ERROR: " + (caught?.message ?? String(caught)));
        }
      });

      document.getElementById("sign").addEventListener("click", async () => {
        if (!wallet) { log("connect first"); return; }
        try {
          const typedData = {
            domain: { name: "PolyTrade Test", version: "1", chainId: 137 },
            types: { TestMessage: [{ name: "text", type: "string" }] },
            primaryType: "TestMessage",
            message: { text: "PolyTrade wallet chain-switch smoke test" },
          };
          const signature = await signTypedPayload(wallet, typedData);
          log("PASS: signature received", { signature });
        } catch (caught) {
          log("FAIL: " + (caught?.message ?? String(caught)));
        }
      });
    </script>
  </body>
</html>
