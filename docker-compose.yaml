name: polytrade

x-agent-environment: &agent-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  GATEWAY_BASE_URL: http://gateway:4000
  BACKTEST_BASE_URL: http://backtest-api:8100
  LANGGRAPH_AES_KEY: ${LANGGRAPH_AES_KEY:?LANGGRAPH_AES_KEY is required}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  AGENT_HTTP_TIMEOUT_SECONDS: ${AGENT_HTTP_TIMEOUT_SECONDS:-15}
  AGENT_RUN_TIMEOUT_SECONDS: ${AGENT_RUN_TIMEOUT_SECONDS:-300}
  AGENT_MAX_CONCURRENT_RUNS: ${AGENT_MAX_CONCURRENT_RUNS:-8}
  AGENT_MAX_MESSAGE_CHARS: ${AGENT_MAX_MESSAGE_CHARS:-8000}
  AGENT_THREAD_TTL_DAYS: ${AGENT_THREAD_TTL_DAYS:-30}
  BACKTEST_MAX_ACTIVE_RUNS_PER_OWNER: ${BACKTEST_MAX_ACTIVE_RUNS_PER_OWNER:-10}
  LANGSMITH_TRACING: "false"
  LANGCHAIN_TRACING_V2: "false"
  ASSETHERO_API_ISSUER: ${ASSETHERO_API_ISSUER:-}
  ASSETHERO_API_JWKS_URL: ${ASSETHERO_API_JWKS_URL:-}
  ASSETHERO_API_AUDIENCE: ${ASSETHERO_API_AUDIENCE:-polytrade}
  CLERK_ISSUER: ${CLERK_ISSUER:?CLERK_ISSUER is required}
  CLERK_JWKS_URL: ${CLERK_JWKS_URL:?CLERK_JWKS_URL is required}
  CLERK_AUDIENCE: ${CLERK_AUDIENCE:-polytrade}

x-backtest-environment: &backtest-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_BROKER_URL: ${REDIS_BROKER_URL:-redis://redis:6379/0}
  REDIS_RESULT_URL: ${REDIS_RESULT_URL:-redis://redis:6379/1}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  ASSETHERO_API_ISSUER: ${ASSETHERO_API_ISSUER:-}
  ASSETHERO_API_JWKS_URL: ${ASSETHERO_API_JWKS_URL:-}
  ASSETHERO_API_AUDIENCE: ${ASSETHERO_API_AUDIENCE:-polytrade}
  CLERK_ISSUER: ${CLERK_ISSUER:?CLERK_ISSUER is required}
  CLERK_JWKS_URL: ${CLERK_JWKS_URL:?CLERK_JWKS_URL is required}
  CLERK_AUDIENCE: ${CLERK_AUDIENCE:-polytrade}
  POLYMARKET_GAMMA_URL: ${POLYMARKET_GAMMA_URL:-https://gamma-api.polymarket.com}
  POLYMARKET_CLOB_URL: ${POLYMARKET_CLOB_URL:-https://clob.polymarket.com}
  POLYMARKET_REQUEST_TIMEOUT_SECONDS: ${POLYMARKET_REQUEST_TIMEOUT_SECONDS:-15}
  BACKTEST_MAX_POINTS: ${BACKTEST_MAX_POINTS:-2000000}
  BACKTEST_WORKER_CONCURRENCY: ${BACKTEST_WORKER_CONCURRENCY:-2}
  BACKTEST_MAX_ACTIVE_RUNS_PER_OWNER: ${BACKTEST_MAX_ACTIVE_RUNS_PER_OWNER:-10}
  BACKTEST_MAX_RETRIES: ${BACKTEST_MAX_RETRIES:-5}
  BACKTEST_SOFT_TIME_LIMIT_SECONDS: ${BACKTEST_SOFT_TIME_LIMIT_SECONDS:-840}
  BACKTEST_HARD_TIME_LIMIT_SECONDS: ${BACKTEST_HARD_TIME_LIMIT_SECONDS:-900}
  BACKTEST_VISIBILITY_TIMEOUT_SECONDS: ${BACKTEST_VISIBILITY_TIMEOUT_SECONDS:-1200}
  BACKTEST_STALE_SECONDS: ${BACKTEST_STALE_SECONDS:-960}
  BACKTEST_OUTBOX_INTERVAL_SECONDS: ${BACKTEST_OUTBOX_INTERVAL_SECONDS:-2}

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - polytrade-redis:/data

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CREDENTIALS_KEK_BASE64: ${CREDENTIALS_KEK_BASE64:?CREDENTIALS_KEK_BASE64 is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32,::1/128}
      AGENT_UPSTREAM_URL: http://agent:8000
      BACKTEST_UPSTREAM_URL: http://backtest-api:8100
      UPSTREAM_PROXY_TIMEOUT_MS: ${UPSTREAM_PROXY_TIMEOUT_MS:-60000}
      ASSETHERO_API_ISSUER: ${ASSETHERO_API_ISSUER:-}
      ASSETHERO_API_JWKS_URL: ${ASSETHERO_API_JWKS_URL:-}
      ASSETHERO_API_AUDIENCE: ${ASSETHERO_API_AUDIENCE:-polytrade}
      CLERK_ISSUER: ${CLERK_ISSUER:?CLERK_ISSUER is required}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:?CLERK_JWKS_URL is required}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:-polytrade}
      POLYMARKET_GAMMA_URL: ${POLYMARKET_GAMMA_URL:-https://gamma-api.polymarket.com}
      POLYMARKET_DATA_URL: ${POLYMARKET_DATA_URL:-https://data-api.polymarket.com}
      POLYMARKET_CLOB_URL: ${POLYMARKET_CLOB_URL:-https://clob.polymarket.com}
      POLYMARKET_CHAIN_ID: ${POLYMARKET_CHAIN_ID:-137}
      POLYMARKET_REQUEST_TIMEOUT_MS: ${POLYMARKET_REQUEST_TIMEOUT_MS:-10000}
      WALLET_CHALLENGE_TTL_SECONDS: ${WALLET_CHALLENGE_TTL_SECONDS:-300}
      WALLET_SESSION_IDLE_SECONDS: ${WALLET_SESSION_IDLE_SECONDS:-14400}
      WALLET_SESSION_MAX_SECONDS: ${WALLET_SESSION_MAX_SECONDS:-86400}
      ORDER_INTENT_TTL_SECONDS: ${ORDER_INTENT_TTL_SECONDS:-120}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5

  backtest-api:
    build:
      context: .
      dockerfile: services/backtest/Dockerfile
    environment: *backtest-environment
    expose:
      - "8100"
    depends_on:
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  backtest-worker:
    build:
      context: .
      dockerfile: services/backtest/Dockerfile
    command: ["celery", "--app=polytrade_backtest.celery_app:celery_app", "worker", "--loglevel=INFO"]
    environment: *backtest-environment
    depends_on:
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --app=polytrade_backtest.celery_app:celery_app inspect ping --destination celery@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment: *agent-environment
    expose:
      - "8000"
    depends_on:
      gateway:
        condition: service_healthy
      backtest-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?VITE_CLERK_PUBLISHABLE_KEY is required}
        VITE_CLERK_JWT_TEMPLATE: ${VITE_CLERK_JWT_TEMPLATE:-polytrade}
    ports:
      - "5173:8080"
    depends_on:
      agent:
        condition: service_healthy
      backtest-api:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  polytrade-redis:
