[project]
name = "polytrade-backtest"
version = "4.0.0"
description = "Deterministic PolyTrade single-market backtesting service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery[redis]>=5.5.3,<6",
  "fastapi>=0.133.1,<0.134",
  "httpx>=0.28.1,<0.29",
  "psycopg[binary,pool]>=3.3.4,<4",
  "pydantic-settings>=2.10.1,<3",
  "PyJWT[crypto]>=2.10.1,<3",
  "uvicorn[standard]>=0.51.0,<0.52",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
  "respx>=0.22.0,<0.23",
  "ruff>=0.12.7,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polytrade_backtest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]
